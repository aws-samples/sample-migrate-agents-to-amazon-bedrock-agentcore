# Deploy an AI agent to Amazon Bedrock AgentCore Runtime using GitHub Actions.
#
# This deploys via CreateAgentRuntime with codeConfiguration: a zip of the agent
# and its vendored dependencies, uploaded to Amazon S3. There is no container
# build, no registry and no Node.js toolchain in this job -- pip is the only
# build tool, and it cross-compiles the Linux ARM64 wheels Runtime needs from
# whatever architecture the runner happens to be. See
# examples/stage1_replatform/deploy_runtime.py for the packaging rules.
#
# This is a SAMPLE workflow for the blog post. The trigger is workflow_dispatch
# and only workflow_dispatch, on purpose: a sample that fired on push would
# deploy real AWS resources out of a reader's fork. Do not add other triggers.
#
# Prerequisites:
#   - An IAM role configured for GitHub Actions OIDC federation, stored as the
#     AWS_ROLE_ARN secret. It needs more than a container push did: S3 (create
#     the artifact bucket, put the object), IAM (create the Runtime execution
#     role and attach its inline policy), bedrock-agentcore-control (create,
#     update and read the runtime) and bedrock-agentcore (invoke it).
#   - An AgentCore Gateway and an AgentCore Memory already created; this job
#     takes their URL and id as inputs rather than creating them.
#
# For setup instructions, refer to:
# https://aws.amazon.com/blogs/machine-learning/deploy-ai-agents-on-amazon-bedrock-agentcore-using-github-actions/

name: Deploy Agent to AgentCore

on:
  workflow_dispatch: # checkov:skip=CKV_GHA_7:gateway_url and memory_id must come from the reader's AWS account; repository variables would break the sample
    inputs:
      gateway_url:
        description: "AgentCore Gateway MCP endpoint URL"
        required: true
        type: string
      memory_id:
        description: "AgentCore Memory id (for example MigratedAgentMemory-xxxx)"
        required: true
        type: string

env:
  AWS_REGION: us-east-1

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC assume-role
      contents: read # checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # boto3 only. The 196 MB of agent dependencies are not installed into the
      # runner: deploy_runtime.py pip-installs them into a staging tree built for
      # Linux ARM64 and zips that, so installing them here as host wheels would
      # be both slower and the wrong architecture.
      - name: Install boto3
        run: python3 -m pip install --quiet boto3

      # Builds the zip, uploads it, creates or updates the runtime, waits for
      # READY, then invokes it once. The invocation is deliberate: an artifact
      # with the wrong binaries fails at create, but a missing vendored module
      # only ever shows up on an invoke.
      - name: Deploy to AgentCore Runtime
        run: |
          python3 -m examples.stage1_replatform.deploy_runtime \
            --gateway-url "${{ inputs.gateway_url }}" \
            --memory-id "${{ inputs.memory_id }}" \
            --region "${{ env.AWS_REGION }}"
